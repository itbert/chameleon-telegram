version: "3.9"

services:
  bridge:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["run", "--config", "/etc/chameleon/config.toml"]
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./config.toml:/etc/chameleon/config.toml:ro
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  client:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/usr/local/bin/chameleon-client"]
    command: ["run", "--config", "/etc/chameleon/config.toml"]
    restart: unless-stopped
    depends_on:
      bridge:
        condition: service_healthy
    ports:
      - "1080:1080"
      - "7777:7777"
    volumes:
      - ./config.toml:/etc/chameleon/config.toml:ro
    environment:
      - RUST_LOG=info
